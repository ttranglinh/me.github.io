<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>me — Creative Coder </title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       MONOCHROME DESIGN TOKENS (LIGHT & DARK MODES)
       ========================================================================== */
    :root {
      --bg: #ffffff;
      --bg-subtle: #f7f7f5;
      --bg-hover: #efefef;
      --card-surface: #fafafa;
      --ink: #111111;
      --ink-muted: #666664;
      --ink-faint: #9a9a96;
      --border: #e4e4e1;
      --border-strong: #111111;
      --tag-bg: #f0f0ed;
      --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.08);
      --shadow-lift: 0 18px 40px rgba(0, 0, 0, 0.14);
    }

    [data-theme="dark"] {
      --bg: #111111;
      --bg-subtle: #181818;
      --bg-hover: #232323;
      --card-surface: #151515;
      --ink: #f4f4f2;
      --ink-muted: #9b9b97;
      --ink-faint: #666664;
      --border: #292929;
      --border-strong: #f4f4f2;
      --tag-bg: #202020;
      --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.55);
      --shadow-lift: 0 18px 44px rgba(0, 0, 0, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    .font-tarot {
      font-family: 'Cinzel', Georgia, serif;
    }

    /* ==========================================================================
       NOTION TOP BREADCRUMB BAR
       ========================================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--ink-muted);
      min-width: 0;
    }

    .breadcrumb .crumb-active {
      color: var(--ink);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mono-btn {
      background: var(--bg-subtle);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .mono-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .mono-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .mono-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .mono-btn.solid {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
      font-weight: 500;
    }

    .mono-btn.solid:hover:not(:disabled) {
      opacity: 0.88;
    }

    /* ==========================================================================
       MAIN PAGE CONTAINER & AVATAR HEADER
       ========================================================================== */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 20px 88px;
    }

    .hero-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 22px;
      margin-bottom: 28px;
    }

    /* Avatar Circle with clean monochrome fallback */
    .avatar-frame {
      position: relative;
      flex: 0 0 auto;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
    }

    .avatar-circle {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 9999px;
      filter: grayscale(100%) contrast(1.08);
      display: block;
    }

    .avatar-fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      background: var(--bg-subtle);
    }

    .avatar-frame.is-fallback .avatar-circle {
      display: none;
    }

    .avatar-frame.is-fallback .avatar-fallback {
      display: flex;
    }

    .hero-text {
      min-width: 220px;
      flex: 1;
    }

    h1 {
      font-size: clamp(28px, 4.5vw, 36px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--ink-muted);
      font-size: 14.5px;
    }

    /* ==========================================================================
       PROPERTY METADATA & CALLOUT BLOCK
       ========================================================================== */
    .properties {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      margin-bottom: 24px;
      display: grid;
      gap: 10px;
      font-size: 13px;
    }

    .prop-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px;
      align-items: center;
    }

    .prop-key {
      color: var(--ink-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .prop-val {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .tag {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink);
    }

    .social-links a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      margin-right: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding-bottom: 1px;
    }

    .social-links a:hover {
      border-bottom-color: var(--border-strong);
    }

    .callout {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border-strong);
      border-radius: 4px;
      padding: 14px 16px;
      margin-bottom: 36px;
      font-size: 13.5px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .callout-glyph {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      padding: 1px 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 3px;
      font-size: 12px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       PROJECTS SECTION HEADER, FILTERS & VIEW MODE TOGGLE
       ========================================================================== */
    .projects-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .filter-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-muted);
      padding: 4px 9px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .filter-tab:hover {
      color: var(--ink);
      background: var(--bg-subtle);
    }

    .filter-tab.active {
      color: var(--ink);
      background: var(--bg-subtle);
      border-color: var(--border);
      font-weight: 600;
    }

    .view-switch {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      background: var(--bg-subtle);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--ink-muted);
      padding: 4px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      cursor: pointer;
    }

    .view-btn.active {
      background: var(--ink);
      color: var(--bg);
      font-weight: 500;
    }

    /* ==========================================================================
       WOODCUT / LINE-ART TAROT CARD STYLING (PORTRAIT 2:3 PROPORTIONS)
       ========================================================================== */
    .tarot-card {
      aspect-ratio: 2 / 3;
      background: var(--card-surface);
      border: 1.5px solid var(--border-strong);
      border-radius: 8px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
      position: relative;
      user-select: none;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, border-color 0.2s ease;
    }

    .tarot-inner-frame {
      flex: 1;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 8px 8px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background: var(--bg);
    }

    .tarot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }

    .tarot-roman {
      color: var(--ink);
    }

    .tarot-arcana-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 500;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
    }

    .tarot-art-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 4px;
      position: relative;
      overflow: hidden;
    }

    .tarot-art-box svg {
      width: 100%;
      height: 100%;
      max-height: 175px;
      stroke: var(--ink);
      fill: none;
    }

    .tarot-nameplate {
      border-top: 1.5px solid var(--border-strong);
      background: var(--bg-subtle);
      padding: 7px 6px;
      text-align: center;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--ink);
    }

    /* ==========================================================================
       STACKED DECK STAGE & INSPECTOR PANEL
       ========================================================================== */
    .deck-stage-layout {
      display: grid;
      grid-template-columns: minmax(220px, 270px) 1fr;
      gap: 28px;
      align-items: start;
    }

    .deck-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .card-stack-viewport {
      position: relative;
      width: 240px;
      aspect-ratio: 2 / 3;
      cursor: pointer;
    }

    .card-stack-viewport .tarot-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .deck-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .deck-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--ink-muted);
      text-align: center;
    }

    /* Drawn Card Dossier / Inspector */
    .dossier-panel {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-subtle);
      padding: 20px 22px;
    }

    .dossier-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--ink-muted);
    }

    .dossier-title {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .dossier-desc {
      font-size: 13.5px;
      color: var(--ink-muted);
      margin-bottom: 14px;
    }

    .dossier-meaning {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 12.5px;
      margin-bottom: 16px;
    }

    .dossier-meaning strong {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 3px;
    }

    .dossier-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    /* ==========================================================================
       SPREAD / GRID VIEW OF TAROT CARDS
       ========================================================================== */
    .spread-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 18px;
    }

    .spread-grid.active {
      display: grid;
    }

    .deck-stage-layout.hidden-view {
      display: none;
    }

    .spread-card-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .spread-card-wrap .tarot-card {
      cursor: pointer;
    }

    .spread-card-wrap .tarot-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lift);
    }

    .spread-meta {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-subtle);
      padding: 9px 10px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .spread-meta p {
      color: var(--ink-muted);
      font-size: 11.5px;
      line-height: 1.45;
    }

    .spread-meta-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--ink-muted);
    }

    /* ==========================================================================
       FOOTER
       ========================================================================== */
    footer {
      margin-top: 64px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--ink-muted);
    }

    @media (max-width: 720px) {
      .deck-stage-layout {
        grid-template-columns: 1fr;
      }
      .card-stack-viewport {
        width: 215px;
      }
      .prop-row {
        grid-template-columns: 1fr;
        gap: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Notion Breadcrumb Bar -->
  <header class="topbar">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <span>me.inventor</span>
      <span>/</span>
      <span class="crumb-active">Creative Coder</span>

    <button type="button" class="mono-btn" id="themeToggle" aria-label="Toggle light or dark monochrome mode">
      <span id="themeIcon">◐</span>
      <span id="themeLabel">Monochrome</span>

  </header>

  <main class="container">
    <!-- Hero Header with Avatar (<img src="avatar.png" alt="Linh" class="avatar-circle">) -->

      <div class="hero-text">

      </div>

    <!-- Property Metadata Block -->
    <section class="properties" aria-label="Metadata properties">
      <div class="prop-row">
        <div class="prop-key">Philosophy</div>
        <div class="prop-val">
          <span class="tag">Less is more</span>
          <span class="tag">Demystification</span>
          <span class="tag">Visual Craft</span>
        </div>
      </div>
      <div class="prop-row">
        <div class="prop-key">Toolkit</div>
        <div class="prop-val">
          <span class="tag">Python</span>

          <a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">TikTok ↗</a>
          <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
        </div>
      </div>
    </section>

    <!-- Tarot Deck / Spread Projects Section -->
    <section aria-labelledby="projectsHeading">
      <div class="projects-toolbar">
        <h2 class="section-title" id="projectsHeading">Project Arcana Deck</h2>

        <div class="toolbar-right">
          <div class="filter-tabs" role="tablist" aria-label="Filter projects by category">
            <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true">All</button>
            <button type="button" class="filter-tab" data-filter="games" role="tab" aria-selected="false">Games</button>
            <button type="button" class="filter-tab" data-filter="simulations" role="tab" aria-selected="false">Simulations</button>
            <button type="button" class="filter-tab" data-filter="tools" role="tab" aria-selected="false">Tools</button>
          </div>

          <div class="view-switch" role="group" aria-label="Card layout mode">
            <button type="button" class="view-btn active" id="viewDeckBtn">Stack Deck</button>
            <button type="button" class="view-btn" id="viewGridBtn">Full Spread</button>
          </div>
        </div>
      </div>

      <!-- Mode 1: Interactive Stacked Tarot Deck + Dossier Inspector -->
      <div class="deck-stage-layout" id="deckStage">
        <div class="deck-column">
          <div class="card-stack-viewport" id="cardStack" title="Click to draw / cycle next card" role="button" tabindex="0" aria-label="Interactive tarot card stack. Click to cycle to next project.">
            <!-- Cards rendered via JS -->
          </div>

          <div class="deck-controls">
            <button type="button" class="mono-btn" id="prevCardBtn" aria-label="Previous card">← Prev</button>
            <button type="button" class="mono-btn solid" id="drawCardBtn">Draw Next →</button>
            <button type="button" class="mono-btn" id="shuffleDeckBtn" aria-label="Shuffle deck">Shuffle</button>
          </div>

          <div class="deck-counter" id="deckCounter">Card I of VIII</div>
        </div>

        <aside class="dossier-panel" id="dossierPanel" aria-live="polite">
          <!-- Active card details rendered via JS -->
        </aside>
      </div>

      <!-- Mode 2: Full Tarot Card Grid / Spread -->
      <div class="spread-grid" id="spreadGrid" aria-label="Full tarot card spread">
        <!-- Grid cards rendered via JS -->
      </div>
    </section>

    <footer>
      <span>me.inventor </span>
    </footer>
  </main>

        category: "games",
        categoryLabel: "Classic Arcade Game",
        status: "Planned",
        live: false,
        url: "",
        tags: ["Queue / Deque", "Game Loop", "Collisions"],
        description: "Discrete-step grid arcade game featuring direction buffering, food spawning, and boundary/self collision rules.",
        concept: "Representing the snake body as an ordered coordinate queue where movement appends head and pops tail.",
        art: `

    const ROMAN_NUMERALS = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];

    // State
    let deckOrder = [...PROJECTS];
    let activeFilter = "all";
    let activeIndex = 0;
    let viewMode = "deck"; // "deck" | "grid"

    // DOM Elements
    const themeToggle = document.getElementById("themeToggle");
    const themeLabel = document.getElementById("themeLabel");
    const filterTabs = document.querySelectorAll(".filter-tab");
    const viewDeckBtn = document.getElementById("viewDeckBtn");
    const viewGridBtn = document.getElementById("viewGridBtn");
    const deckStage = document.getElementById("deckStage");
    const spreadGrid = document.getElementById("spreadGrid");
    const cardStack = document.getElementById("cardStack");
    const dossierPanel = document.getElementById("dossierPanel");
    const deckCounter = document.getElementById("deckCounter");
    const prevCardBtn = document.getElementById("prevCardBtn");
    const drawCardBtn = document.getElementById("drawCardBtn");
    const shuffleDeckBtn = document.getElementById("shuffleDeckBtn");

    function getFilteredProjects() {
      if (activeFilter === "all") return deckOrder;
      return deckOrder.filter((p) => p.category === activeFilter);
    }

    function buildTarotCardElement(project, displayNumeral) {
      const card = document.createElement("article");
      card.className = "tarot-card";
      card.innerHTML = `
        <div class="tarot-inner-frame">
          <div class="tarot-header">
            <span class="tarot-roman">${displayNumeral}</span>
            <span class="tarot-arcana-code">${project.code}</span>
          </div>
          <div class="tarot-art-box">
            ${project.art}
          </div>
          <div class="tarot-nameplate">${project.title}</div>
        </div>
      `;
      return card;
    }

    function renderDeckView(items) {
      cardStack.innerHTML = "";

      if (items.length === 0) {
        deckCounter.textContent = "0 cards";
        dossierPanel.innerHTML = `<p class="dossier-desc">No cards in this category.</p>`;
        return;
      }

      if (activeIndex >= items.length) activeIndex = 0;
      if (activeIndex < 0) activeIndex = items.length - 1;

      const current = items[activeIndex];
      const total = items.length;

      // Render up to 4 stacked cards starting from activeIndex so the top card is on top
      const visibleCount = Math.min(4, total);
      for (let offset = visibleCount - 1; offset >= 0; offset--) {
        const idx = (activeIndex + offset) % total;
        const proj = items[idx];
        const cardEl = buildTarotCardElement(proj, ROMAN_NUMERALS[idx] || proj.numeral);

        // Subtle fan/stack offset behind the top card
        const tx = offset * 5;
        const ty = offset * 4;
        const rot = offset === 0 ? 0 : (offset % 2 === 0 ? -1.8 * offset : 1.8 * offset);
        const scale = 1 - offset * 0.025;

        cardEl.style.zIndex = String(20 - offset);
        cardEl.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${scale})`;
        cardEl.style.opacity = offset === 0 ? "1" : String(Math.max(0.55, 1 - offset * 0.14));

        if (offset === 0) {
          cardEl.addEventListener("click", () => {
            activeIndex = (activeIndex + 1) % total;
            renderProjects();
          });
        }

        cardStack.appendChild(cardEl);
      }

      prevCardBtn.disabled = total <= 1;
      drawCardBtn.disabled = total <= 1;
      deckCounter.textContent = `Card ${ROMAN_NUMERALS[activeIndex] || activeIndex + 1} of ${total}`;

      // Render detailed inspector for active card
      const actionHtml = current.live && current.url
        ? `<a href="${current.url}" class="mono-btn solid">Launch ${current.url} ↗</a>`
        : `<span class="mono-btn" style="opacity:0.65; cursor:default;">${current.status}</span>`;

      dossierPanel.innerHTML = `
        <div class="dossier-top">
          <span>${current.categoryLabel}</span>
          <span>Status: <strong>${current.status}</strong></span>
        </div>
        <h3 class="dossier-title">${current.fullTitle}</h3>
        <p class="dossier-desc">${current.description}</p>
        <div class="dossier-meaning">
          <strong>Core Mechanism / Concept</strong>
          <span>${current.concept}</span>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;">
          ${current.tags.map((t) => `<span class="tag">${t}</span>`).join("")}
        </div>
        <div class="dossier-footer">
          <span class="font-mono-code" style="font-size:11px; color:var(--ink-muted);">Click card or "Draw Next" to cycle</span>
          ${actionHtml}
        </div>
      `;
    }

    function renderGridView(items) {
      spreadGrid.innerHTML = "";

      items.forEach((proj, idx) => {
        const wrap = document.createElement("div");
        wrap.className = "spread-card-wrap";

        const cardEl = buildTarotCardElement(proj, ROMAN_NUMERALS[idx] || proj.numeral);
        cardEl.addEventListener("click", () => {
          if (proj.live && proj.url) {
            window.location.href = proj.url;
          } else {
            activeIndex = idx;
            setViewMode("deck");
          }
        });

        const linkAction = proj.live && proj.url
          ? `<a href="${proj.url}" class="mono-btn solid" style="padding:3px 8px; font-size:10.5px;">Open ↗</a>`
          : `<span>${proj.status}</span>`;

        const meta = document.createElement("div");
        meta.className = "spread-meta";
        meta.innerHTML = `
          <p>${proj.description}</p>
          <div class="spread-meta-bottom">
            <span>${proj.tags[0] || proj.categoryLabel}</span>
            ${linkAction}
          </div>
        `;

        wrap.appendChild(cardEl);
        wrap.appendChild(meta);
        spreadGrid.appendChild(wrap);
      });
    }

    function renderProjects() {
      const items = getFilteredProjects();
      if (viewMode === "deck") {
        deckStage.classList.remove("hidden-view");
        spreadGrid.classList.remove("active");
        renderDeckView(items);
      } else {
        deckStage.classList.add("hidden-view");
        spreadGrid.classList.add("active");
        renderGridView(items);
      }
    }

    function setViewMode(mode) {
      viewMode = mode;
      viewDeckBtn.classList.toggle("active", mode === "deck");
      viewGridBtn.classList.toggle("active", mode === "grid");
      renderProjects();
    }

    // Theme Toggle
    themeToggle.addEventListener("click", () => {
      const root = document.documentElement;
      const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
      root.setAttribute("data-theme", next);
      themeLabel.textContent = next === "dark" ? "Dark Mono" : "Monochrome";
    });

    // Category Tabs
    filterTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        filterTabs.forEach((t) => {
          t.classList.remove("active");
          t.setAttribute("aria-selected", "false");
        });
        tab.classList.add("active");
        tab.setAttribute("aria-selected", "true");
        activeFilter = tab.dataset.filter;
        activeIndex = 0;
        renderProjects();
      });
    });

    // View Switcher
    viewDeckBtn.addEventListener("click", () => setViewMode("deck"));
    viewGridBtn.addEventListener("click", () => setViewMode("grid"));

    // Deck Navigation Controls
    prevCardBtn.addEventListener("click", () => {
      const items = getFilteredProjects();
      if (!items.length) return;
      activeIndex = (activeIndex - 1 + items.length) % items.length;
      renderProjects();
    });

    drawCardBtn.addEventListener("click", () => {
      const items = getFilteredProjects();
      if (!items.length) return;
      activeIndex = (activeIndex + 1) % items.length;
      renderProjects();
    });

    shuffleDeckBtn.addEventListener("click", () => {
      for (let i = deckOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deckOrder[i], deckOrder[j]] = [deckOrder[j], deckOrder[i]];
      }
      activeIndex = 0;
      renderProjects();
    });

    cardStack.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        drawCardBtn.click();
      }
    });

    // Initial Render
    renderProjects();
  </script>
